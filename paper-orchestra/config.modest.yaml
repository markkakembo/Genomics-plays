# Low-token profile for a quick real run on a free-tier Gemini key (5 requests/min, 20/day per model).
# ~18 LLM calls: outline 1, intro+related work 1, 3 figures x 4, sections 1, review 2, revision 1.
# Literature candidates come from OpenAlex/arXiv keyword search (no LLM discovery calls); every
# candidate is still checked for title, abstract and cutoff before it can be cited.
provider: gemini
models:
  writer: gemini-3.5-flash-lite
  reflection: gemini-3.5-flash-lite
  plotting: gemini-3.1-flash-lite
  discovery: gemini-3.5-flash-lite
template: iclr2025
use_plotting: true
plotting_max_critic_rounds: 0
max_reflections: 1
review_ensemble: 1
formatting_loop: false
latex_engine: auto
lit:
  max_search_tasks: 8
  keyword_search_results: 5
  use_web_search: false
  use_llm_recall: false
  use_keyword_search: true
