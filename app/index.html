<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Da Vinci's Poet | Literature Explorer</title>
<style>
:root{font-family:system-ui,Arial,sans-serif;color:#e9eef9;background:#0b1220}
body{margin:0}main{max-width:900px;margin:auto;padding:36px 20px}
h1{font-size:clamp(2rem,5vw,3.5rem);margin-bottom:8px}
.sub,small{color:#aab9d2}
section{background:#142039;border:1px solid #2d405f;border-radius:16px;padding:22px;margin:24px 0}
label{display:block;margin:12px 0 6px}
textarea,input{box-sizing:border-box;width:100%;background:#0b1528;color:white;border:1px solid #455b7b;border-radius:8px;padding:12px;font:inherit}
button{border:0;border-radius:9px;background:#d6b56b;color:#111827;font-weight:700;padding:12px 20px;cursor:pointer;margin-top:14px}
button:disabled{opacity:.6}pre{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6}
a{color:#e5c77c}.pill{display:inline-block;background:#284565;border-radius:20px;padding:5px 10px;font-size:.8rem}
</style></head>
<body><main>
<span class="pill">Da Vinci's Poet · Evidence-first research · v0.1</span>
<h1>ResearchOrchestra</h1>
<p class="sub">Discover scholarly records. Inspect evidence. Export a cautious literature dossier.</p>
<section>
<label for="question">Research question</label>
<textarea id="question" rows="3">What is the role of uremic toxins in chronic kidney disease progression?</textarea>
<label for="key">Application API key (only if configured)</label>
<input id="key" type="password" autocomplete="off" placeholder="Optional for local setup">
<button id="run">Run literature pipeline</button><p id="status" role="status"></p>
</section>
<section id="results" hidden>
<h2>Research dossier</h2><button id="download">Download Markdown</button>
<pre id="report"></pre><h2>Source records</h2><div id="sources"></div>
</section>
<small>Discovery prototype, not a systematic review. Human verification required. Built by Mark Kakembo.</small>
</main>
<script>
let latest="";
const run=document.getElementById("run");
run.onclick=async()=>{
run.disabled=true;
document.getElementById("status").textContent="Searching and assembling evidence…";
try{
const headers={"Content-Type":"application/json"};
const key=document.getElementById("key").value;
if(key)headers["X-API-Key"]=key;
const response=await fetch("/api/research",{method:"POST",headers,body:JSON.stringify({question:document.getElementById("question").value,limit:8})});
const data=await response.json();
if(!response.ok)throw Error(data.detail||"Request failed");
latest=data.report_markdown;
document.getElementById("report").textContent=latest;
const sources=document.getElementById("sources");sources.replaceChildren();
data.papers.forEach((paper,i)=>{
const div=document.createElement("p");
const a=document.createElement("a");
a.href="https://doi.org/"+encodeURIComponent(paper.doi);
a.target="_blank";a.rel="noopener noreferrer";
a.textContent="[S"+(i+1)+"] "+paper.title;
div.append(a,document.createTextNode(" · "+paper.evidence_status));
sources.append(div);
});
document.getElementById("results").hidden=false;
document.getElementById("status").textContent=data.papers.length+" records · "+data.generation_mode+" · human review required";
}catch(e){document.getElementById("status").textContent=e.message}
finally{run.disabled=false}
};
document.getElementById("download").onclick=()=>{
const blob=new Blob([latest],{type:"text/markdown"});
const a=document.createElement("a");
a.href=URL.createObjectURL(blob);a.download="research-dossier.md";a.click();
setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
</script></body></html>
